name: 抖音自动续火花

on:
  workflow_dispatch:
    inputs:
      recipient_index:
        description: "0 仅检查登录；大于 0 时给启用好友列表中的对应序号发送一条私信"
        type: number
        default: 0

permissions:
  contents: read

concurrency:
  group: douyin-fire
  cancel-in-progress: false

jobs:
  send-messages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
      DOUYIN_RECIPIENT_INDEX: ${{ inputs.recipient_index }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 验证并写入 Cookie
        env:
          DOUYIN_COOKIES: ${{ secrets.DOUYIN_COOKIES }}
        run: |
          umask 077
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          try:
              cookies = json.loads(os.environ.get("DOUYIN_COOKIES", ""))
          except ValueError:
              raise SystemExit("请在 Actions Secret 中设置有效的 DOUYIN_COOKIES。")
          if not isinstance(cookies, list) or not cookies or not all(isinstance(cookie, dict) for cookie in cookies):
              raise SystemExit("DOUYIN_COOKIES 必须是非空的 Cookie 对象列表。")
          Path("cookies.json").write_text(json.dumps(cookies), encoding="utf-8")
          PY

      - name: 检查登录或试发一条私信
        run: |
          if python main.py > /dev/null 2>&1; then
            echo "抖音任务通过。"
          else
            echo "::error::抖音任务失败。请检查登录状态、收件人序号、发送窗口和抖音页面。"
            exit 1
          fi

      - name: 清理 Cookie
        if: always()
        run: rm -f -- cookies.json
